<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toshi Beans | Order Confirmed</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================
           PAGE
        ========================= */

        body.order-confirmed-body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background-image: url("images/home.png");
            background-size: 100vw 100vh;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;

            background-color: #F7F1E8;
        }


        /* =========================
           HEADER
        ========================= */

        .order-confirmed-body .site-header {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(6px);
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .confirmed-page {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 55px 20px;
        }


        /* =========================
           CONFIRMATION CARD
        ========================= */

        .confirmed-card {
            width: min(700px, calc(100% - 30px));
            min-height: 400px;

            padding: 45px 45px;

            border: 1px solid #B88968;
            border-radius: 16px;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.08)
                ),
                url("images/cart.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(59, 40, 30, 0.08);
        }


        /* =========================
           CHECK ICON
        ========================= */

        .confirmation-check {
            width: 70px;
            height: 70px;

            margin-bottom: 16px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #7B4A2C;
            color: #FFFFFF;

            font-size: 38px;
            font-weight: 700;

            line-height: 1;
        }


        /* =========================
           THANK YOU
        ========================= */

        .confirmed-small-title {
            margin: 0 0 14px;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 3px;

            color: #7B4A2C;
        }


        /* =========================
           TITLE
        ========================= */

        .confirmed-card h1 {
            margin: 0 0 15px;

            font-size: 31px;
            font-weight: 700;

            color: #3B281E;
        }


        /* =========================
           MESSAGE
        ========================= */

        .confirmed-message {
            margin: 0 0 14px;

            font-size: 13px;

            color: #765B4A;
        }


        /* =========================
           ORDER NUMBER
        ========================= */

        .confirmed-order-number {
            margin-bottom: 24px;

            font-size: 14px;
            font-weight: 700;

            color: #3B281E;
        }


        /* =========================
           BUTTON
        ========================= */

        .confirmed-menu-button {
            width: 260px;
            min-height: 45px;

            border-radius: 8px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: #7B4A2C;

            color: #FFFFFF;

            text-decoration: none;

            font-size: 12px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .confirmed-menu-button:hover {
            background: #5E351F;
            transform: translateY(-2px);
        }


        /* =========================
           FOOTER
        ========================= */

        .order-confirmed-body .site-footer {
            width: 100%;

            margin: 0;
            padding: 0;

            min-height: 70px;

            display: flex;
            align-items: center;

            background: #3B281E;

            color: #FFFFFF;
        }

        .order-confirmed-body .footer-container {
            width: min(1200px, calc(100% - 40px));

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;

            text-align: center;
        }

        .order-confirmed-body .footer-brand {
            font-size: 11px;
            font-weight: 500;

            color: #FFFFFF;
        }

        .order-confirmed-body .footer-text {
            font-size: 11px;

            color: #F0E7DF;
        }

        .order-confirmed-body .copyright {
            font-size: 11px;

            color: #F0E7DF;

            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .confirmed-page {
                padding: 35px 15px;
            }

            .confirmed-card {
                min-height: 360px;

                padding: 35px 22px;
            }

            .confirmation-check {
                width: 62px;
                height: 62px;

                font-size: 32px;
            }

            .confirmed-card h1 {
                font-size: 26px;
            }

            .confirmed-menu-button {
                width: 100%;
            }

            .order-confirmed-body .footer-container {
                flex-direction: column;

                gap: 3px;

                padding: 14px 0;
            }

        }

    </style>
</head>


<body class="order-confirmed-body">


    <!-- HEADER -->
    <header class="site-header">

        <div class="header-container">

            <a href="index.html" class="brand">
                TOSHI BEANS
            </a>

            <nav class="main-nav">

                <a href="index.html" class="nav-link">
                    HOME
                </a>

                <a href="menu.html" class="nav-link">
                    MENU
                </a>

                <a href="about.html" class="nav-link">
                    ABOUT
                </a>

                <a href="contact.html" class="nav-link">
                    CONTACT
                </a>

                <a href="login.html" class="nav-link">
                    LOGIN
                </a>

                <a href="signup.html" class="signup-btn">
                    SIGN UP
                </a>

                <a href="cart.html" class="order-nav-btn">
                    CART
                </a>

            </nav>

        </div>

    </header>


    <!-- ORDER CONFIRMED -->
    <main class="confirmed-page">

        <section class="confirmed-card">


            <!-- CHECK -->
            <div class="confirmation-check">
                ✓
            </div>


            <p class="confirmed-small-title">
                THANK YOU
            </p>


            <h1>
                ORDER CONFIRMED!
            </h1>


            <p class="confirmed-message">
                Thank you for choosing Toshi Beans.
            </p>


            <div
                class="confirmed-order-number"
                id="orderNumber"
            >
                Order #TB2026-001
            </div>


            <a
                href="menu.html"
                class="confirmed-menu-button"
            >
                BACK TO MENU
            </a>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="footer-container">

            <div class="footer-brand">
                TOSHI BEANS
            </div>

            <div class="footer-text">
                • Fresh Coffee & Snacks
            </div>

            <div class="copyright">
                © 2026 Toshi Beans
            </div>

        </div>

    </footer>


    <script>

        /* CLEAR CART */
        localStorage.removeItem(
            "toshiBeansCart"
        );

        localStorage.removeItem(
            "toshiBeansCheckout"
        );


        /* ORDER NUMBER */

        let orderCount =
            parseInt(
                localStorage.getItem(
                    "toshiBeansOrderCount"
                )
            ) || 0;


        orderCount++;


        localStorage.setItem(
            "toshiBeansOrderCount",
            orderCount
        );


        const formattedNumber =
            String(orderCount)
                .padStart(3, "0");


        document.getElementById(
            "orderNumber"
        ).textContent =
            "Order #TB2026-" +
            formattedNumber;

    </script>


    <script src="js/main.js"></script>

</body>

</html>
